# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx8G
org.gradle.configuration-cache=false
# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
# Mod Properties
mod_version=release
maven_group=com.instrumentalist
archives_base_name=Krs
# Dependencies
# check this on https://fabricmc.net/develop
fabric_api_version=0.154.2+26.2
# Imgui
# 1.87.7 (not 1.86.11): since 1.87.0 the macOS native is a universal binary
# (x86_64 + arm64), so ImGui works on Apple Silicon. Java API used by Krs is unchanged.
imguiVersion=1.87.7

# LWJGL version bundled by Krs (NanoVG + STB natives).
# MUST match the LWJGL version Minecraft 26.2 ships. Verified against the official
# 26.2 version manifest (https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
# -> 26.2.json): Minecraft ships org.lwjgl:*:3.4.1. Never bump this independently of
# Minecraft's LWJGL, or Java classes and native binaries will mismatch.
lwjgl_version=3.4.1
